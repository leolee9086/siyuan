name: Verify official Siyuan types

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/package.json"
      - "app/pnpm-lock.yaml"
      - "app/scripts/check-siyuan-types.mjs"
      - ".github/workflows/siyuan-types.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install --global pnpm@11.12.0

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Verify official Siyuan types are current
        run: pnpm run check:siyuan-types
        working-directory: app
